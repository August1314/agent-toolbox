# 工具箱索引 —— 由 toolbox CLI 维护，也可手工编辑。
# provides 是能力标签，检索按标签匹配，不按名字匹配。
# lookup 只做子串匹配，且**只读 provides/name/kind/status/contract 的输入输出，不读正文** ——
# 所以标签要写"卡住那一刻会敲进去的症状词"（中英都写），写完拿那些词回查一遍自己；
# 查不到的条目等于不存在。
#
# 字段约定（lookup 会原样转告；写错就等于对下一个使用者撒谎）：
#   entry.usage   该工具真实接受的参数形状。不填时 lookup 只说"未声明"，不再编模板
#   entry.setup   前置准备命令（建 venv、下模型等）
#   status        ok=现在能跑 / needs_setup=代码在位但前置未就绪
#                 unavailable=来源不可达或装不上（写明恢复条件）/ broken=实测跑不通
#   verified      含义跟着条目形态走（lookup 的「验证:」行会说清是哪种）：
#                 可执行条目 = 登记时 smoke_test 真跑通过；
#                 文档 / 知识条目 = 该流程或结论在真实任务里走过一遍（没有可执行体，谈不上烟测）。
#                 两种都配 verified_at，且都不代表换一台机器、换一个 venv 还能跑
#   cost.smoke_test 必须是**真做得到、而且真做过**的动作 —— 下一个 agent 会照它执行。
#                 被证伪时立刻改写成实际执行的那个动作，别留着让人白跑一轮
#   能不能 toolbox run 由 entry.command 指向的**文件本身**决定（存在 + 可执行位），
#                 不由 kind 的名字决定：入口是 SKILL.md / 文档时 lookup 打「取用: + 用法:」，
#                 可执行时才打「调用:」；run 打在文档型条目上会明确拒绝
#   source.license 每次 lookup 都会打出来 —— 非商用 / 需署名的约束要在调用现场可见
#
# tools:
tools:
