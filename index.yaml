      type: github
      url: ""
      license: MIT
      last_commit: 2026-11-02
    entry:
      command: ./adapter.sh
      args: []
      usage: "--in <pdf 路径> --out <csv 路径>"
    contract:
      input: PDF 文件路径
      output: CSV 文件路径
      limits: 扫描件不支持；合并单元格不做猜测填充
